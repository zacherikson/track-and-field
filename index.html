<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#12203a">
  <title>Track Royale</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #12203a;
      /* Kill every browser gesture that would steal a fast tap:
         double-tap zoom, pinch, scroll, long-press callout, text selection. */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { position: fixed; inset: 0; }
    /* Sized from the fixed body (the visible screen), not 100vh/dvh, which iOS
       can leave stale after launching or rotating a home-screen app. */
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    /* Probe element: lets JS read the notch / home-indicator safe-area insets. */
    #safe-probe {
      position: fixed; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    noscript { color: #fff; font: 16px sans-serif; padding: 20px; display: block; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="safe-probe"></div>
  <noscript>Track Royale needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
