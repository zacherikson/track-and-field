<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#26224F">
  <title>Track Royale</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- The menus' type (core/ui.js FONT_DISPLAY / FONT_BODY); main.js waits for them before the first frame. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #26224F;
      /* Kill every browser gesture that would steal a fast tap:
         double-tap zoom, pinch, scroll, long-press callout, text selection. */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { position: fixed; inset: 0; }
    /* Sized from the fixed body (the visible screen), not 100vh/dvh, which iOS
       can leave stale after launching or rotating a home-screen app. */
    /* The callout and selection again on the canvas itself: some WebViews don't
       pass them down to it, and a held pad (long jump, lean) must never pop one. */
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    /* Probe element: lets JS read the notch / home-indicator safe-area insets. */
    #safe-probe {
      position: fixed; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    noscript { color: #fff; font: 16px sans-serif; padding: 20px; display: block; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="safe-probe"></div>
  <noscript>Track Royale needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
