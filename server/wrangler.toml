# The meet server (docs/meets.md). Deploy: npx wrangler deploy (from server/).
# The game connects to wss://<name>.<your-subdomain>.workers.dev
# (src/online/net.js MEET_SERVER).
name = "track-royale-live"
main = "src/index.js"
compatibility_date = "2025-09-01"

# One SquadHub per squad (meet sign-up, Practice), one Matchmaker, one Meet per meet,
# one Lobby (public live waiting rooms), one Room per live room.
[[durable_objects.bindings]]
name = "SQUADS"
class_name = "SquadHub"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "MEETS"
class_name = "Meet"

[[durable_objects.bindings]]
name = "LOBBIES"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SquadHub", "Matchmaker", "Meet"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby", "Room"]

[vars]
FIREBASE_PROJECT = "track-royale-f18ad"
# DEV_AUTH = "1" accepts made-up "dev:<uid>:<name>" tokens instead of Firebase
# sign-ins, for local testing with bots (npm run dev). Never set it when deploying.

[observability]
enabled = true
