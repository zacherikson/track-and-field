<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pole Vault Phases</title>
<style>
  body { margin: 0; background: #cfe9e6; color: #1b2433; font: 14px system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 14px 16px 4px; }
  p { margin: 0 16px 10px; }
  canvas { display: block; margin: 0 auto 16px; max-width: 100%; }
</style>
</head>
<body>
<h1>Pole vault phases (flat side view, true scale)</h1>
<p>The game's own swing and flight, sampled at fixed moments, for checking against reference photos and diagrams. Serve the repo and open /tools/vault.html. Options: ?height=5.8</p>
<canvas id="c"></canvas>
<script type="module">
import { CONFIG } from '../src/config.js';
import { PoleVault } from '../src/events/poleVault.js';
import { drawFigure, runPose, handPos, POSES } from '../src/athletes/stickFigure.js';
import { HERO } from '../src/athletes/roster.js';

const cfg = CONFIG.poleVault;
const height = Number(new URLSearchParams(location.search).get('height') ?? 5.8);
const PX = 62; // px per m
const W = 1100, Hc = 560;
const X0 = 700; // screen x of the box (x = 0)
const Y0 = Hc - 40; // ground
const S = (x, y) => ({ x: X0 + x * PX, y: Y0 - y * PX });
const cv = document.getElementById('c');
const dpr = window.devicePixelRatio || 1;
cv.width = W * dpr; cv.height = Hc * dpr; cv.style.width = `${W}px`;
const ctx = cv.getContext('2d');
ctx.scale(dpr, dpr);
ctx.fillStyle = '#cfe9e6'; ctx.fillRect(0, 0, W, Hc);

// A vault scene without a game: just the geometry.
const pv = Object.create(PoleVault.prototype);
pv.cfg = cfg;
const figH = CONFIG.figure.height;
pv.L = cfg.pole.length;
pv.plantX = -Math.sqrt(cfg.pole.length ** 2 - cfg.pole.gripY ** 2);
pv.phi0 = Math.asin(cfg.pole.gripY / cfg.pole.length);
const top = handPos(0, 0, figH, { hipX: 0, hipY: 0, lean: -Math.PI, legs: [{ thigh: Math.PI, shin: Math.PI }, { thigh: Math.PI, shin: Math.PI }], arms: [{ upper: 0, fore: 0 }, { upper: 0, fore: 0 }] }, 0);
pv.reach = Math.hypot(top.x, top.y);
pv.vault = { v: 11, u: 0, height, phiEnd: null };
pv.vault.phiEnd = pv.phiFor(height);
pv.vault.phiCur = pv.vault.phiEnd;

// Ground, box, mat, standards, bar.
ctx.strokeStyle = '#2d5d8a'; ctx.lineWidth = 2;
ctx.beginPath(); ctx.moveTo(0, Y0); ctx.lineTo(W, Y0); ctx.stroke();
const box = S(0, 0);
ctx.fillStyle = '#555'; ctx.fillRect(box.x - 0.6 * PX, Y0, 0.6 * PX, 6);
const m0 = S(cfg.mat.from, cfg.mat.height), m1 = S(cfg.mat.to, 0);
ctx.fillStyle = '#2e4fb8'; ctx.fillRect(m0.x, m0.y, m1.x - m0.x, m1.y - m0.y);
const up = S(cfg.uprightX, 7);
ctx.fillStyle = '#e7c21c'; ctx.fillRect(up.x - 3, up.y, 6, Y0 - up.y);
const bar = S(cfg.uprightX, height);
ctx.strokeStyle = '#d33'; ctx.lineWidth = 3;
ctx.beginPath(); ctx.moveTo(bar.x - 14, bar.y); ctx.lineTo(bar.x + 14, bar.y); ctx.stroke();
ctx.fillStyle = '#1b2433'; ctx.font = '12px system-ui';
for (let h = 1; h <= 7; h++) { const p = S(cfg.uprightX, h); ctx.fillText(`${h} m`, p.x + 8, p.y + 4); }
for (let x = -5; x <= 2; x++) { const p = S(x, 0); ctx.fillText(`${x}`, p.x - 4, Y0 + 16); }

const hipPath = [];
function figureAt(hip, pose, alpha = 1) {
  ctx.globalAlpha = alpha;
  const p = S(hip.x, hip.y);
  drawFigure(ctx, p.x, p.y - pose.hipY * figH * PX, figH * PX, pose, HERO.colors, Y0);
  ctx.globalAlpha = 1;
  hipPath.push(p);
}
function pole(hands, c) {
  const a = S(hands.x, hands.y), b = box;
  const sag = Math.sqrt(Math.max(0, (3 * pv.L * (pv.L - c)) / 8)) * PX;
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  const cp = { x: (a.x + b.x) / 2 - (dy / d) * sag * 2 * -1, y: (a.y + b.y) / 2 + (dx / d) * sag * 2 * -1 };
  ctx.strokeStyle = '#3f8f1c'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(cp.x, cp.y, b.x, b.y); ctx.stroke();
}

// Run-up: two strides before the plant, with the pole dropping toward the box.
for (const [dx, p] of [[-2.4, 0.8], [-1.2, 0.93]]) {
  const x = pv.plantX + dx;
  const pose = { ...runPose(1.3 * dx, 1, 0), arms: [{ upper: 0.2, fore: 1.6 }, { upper: 0.7, fore: 2.1 }] };
  figureAt({ x, y: 0.5 * figH * 0 + 0 }, pose, 0.55);
  hipPath.pop();
}
// On the pole.
for (const u of [0, 0.18, 0.36, 0.52, 0.68, 0.84, 1]) {
  const sw = pv.swingAt(u);
  pole(sw.hands, sw.c);
  figureAt(sw.hip, sw.pose);
}
// Off the pole.
pv.state = 'fly';
pv.vault.sw = pv.swingAt(1);
pv.lastPose = pv.vault.sw.pose;
pv.game = { time: 0 };
pv.hip = pv.vault.sw.hip;
pv.setState = () => {};
pv.takeOff(0);
const f = pv.fly;
for (const t of [0.25, 0.45, 0.7, 1.0, 1.25]) {
  pv.game.time = t;
  Object.defineProperty(pv, 'now', { value: t, configurable: true });
  figureAt(pv.flyAt(t), pv.poseFor());
}
// Hip path.
ctx.strokeStyle = 'rgba(220,60,60,0.8)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
ctx.beginPath(); hipPath.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.stroke();
ctx.setLineDash([]);
ctx.fillText(`plant at ${pv.plantX.toFixed(2)} m · standards at +${cfg.uprightX} m · bar ${height} m`, 16, 20);
</script>
</body>
</html>
